<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>空间基因表达预测 · 科研原型</title>
<style>body{margin:0;background:#eef3f5;color:#152c3a;font:16px/1.7 system-ui,sans-serif}main{max-width:760px;margin:60px auto;padding:32px;background:white;border-radius:20px;border:1px solid #dce5e9}small{color:#436573}h1{font-size:30px}label{display:block;margin-top:24px}input{display:block;box-sizing:border-box;width:100%;padding:12px;border:1px solid #c3d3d8;border-radius:8px;font:inherit}button{margin-top:24px;padding:12px 24px;border:0;border-radius:8px;background:#126c68;color:white;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#eef6f6;border-radius:8px}#status{padding:12px;border-left:3px solid #d6a945;background:#fff9ed}@media(max-width:800px){main{margin:16px;padding:22px}}</style>
<main><small>GRADUATION PROJECT / 2022—2026</small><h1>空间基因表达预测</h1><p>H&amp;E 组织图像与基因表达的科研接口原型。当前归档尚缺模型实现与权重，接口接入真实模型后才能产生预测。</p><p id="status" role="status">正在检查模型状态…</p>
<form id="form"><label for="image">组织图像（PNG/JPEG，10 MB 以内）</label><input id="image" type="file" accept="image/png,image/jpeg" required><label for="genes">基因名（英文逗号分隔）</label><input id="genes" value="EGFR,CD3D,CD68" required><button id="submit">请求预测</button></form><pre id="result" aria-live="polite">结果将在此显示。科研原型不用于临床判断。</pre></main>
<script>
fetch('/health').then(r=>r.json()).then(d=>{document.querySelector('#status').textContent=d.model_ready?'真实模型后端已就绪。':'模型未配置：当前可查看界面与接口，暂不能执行真实预测。';}).catch(()=>{document.querySelector('#status').textContent='服务暂不可用。';});
document.querySelector('#form').onsubmit=async event=>{event.preventDefault();const button=document.querySelector('#submit');button.disabled=true;const data=new FormData();data.append('image',document.querySelector('#image').files[0]);data.append('genes',document.querySelector('#genes').value);try{const response=await fetch('/predict',{method:'POST',body:data});const result=await response.json();document.querySelector('#result').textContent=JSON.stringify(result,null,2);}catch(error){document.querySelector('#result').textContent=error.message;}finally{button.disabled=false;}};
</script></html>
